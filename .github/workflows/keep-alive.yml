name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping after 15m
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          echo "Pinging Render backend..."
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s\n" https://resume-analyzer-backend-uk1x.onrender.com/api/health || curl -sS -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s\n" https://resume-analyzer-backend-uk1x.onrender.com/)
          echo "$RESPONSE"
